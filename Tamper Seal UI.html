}

/* Remove or hide header-center as it's no longer used */
.header-center {

}
/* Styling for the Asset | Location text in the green bar */
.asset-header span:first-child {
    white-space: nowrap;

    text-overflow: ellipsis;

/* Row Color Logic */

}

/* AREA ACCORDION STYLES */

.area-header {

<body>

<div class="header">
    <div class="header-left">
        <div class="seal-log-header">Tamper Seal Log</div>

</div>

<div class="subheader">

</div>

<div id="main-content-area">

<script>
// 1. Corrected URL (removed /rest/v1/)
const SUPABASE_URL = 'https://jrhrmntpfxoarulcnbqz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaHJtbnRwZnhvYXJ1bGNuYnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTAyNDUsImV4cCI6MjA5NDE2NjI0NX0.Gbru98OZX5n3gfiRHyQFl-UzzC2SJ9Gi0gjb_HD__SE';

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let dropdownData = { status: [] };

async function initApp() {

    await createAssetLog();
}
    

function addRows(container, assetName, count) {
    const addBtn = container.querySelector('.tool-btn');
    
    for (let i = 0; i < count; i++) {
        const row = document.createElement('div');
        row.className = 'cell-row';
        
        row.innerHTML = `
        <textarea placeholder="Sub Area"></textarea>
            <textarea placeholder="Seal #"></textarea>
            <textarea placeholder="YYYY-MM-DD"></textarea>
            <textarea placeholder="Initials/Name"></textarea>
            <textarea placeholder="Inspection Notes"></textarea>
            <select class="status-dropdown" onchange="applyStatusColor(this)">
                <option value="">Select...</option>
                <option value="Intact">Intact (Pass)</option>
                <option value="Broken">Broken (Fail)</option>
                <option value="Void">Void</option>
            </select>
            <textarea placeholder="Date Broken"></textarea>
            <textarea placeholder="User/Entity"></textarea>
            <textarea placeholder="Reason..."></textarea>
            <button class="delete-btn" onclick="this.parentElement.remove()">×</button>
        `;

        if (addBtn) container.insertBefore(row, addBtn);
        else container.appendChild(row);
    }
}

async function createAssetLog() {
    const container = document.getElementById('main-content-area');
    container.innerHTML = '<p style="text-align:center; padding:20px;">Scanning all entries for Areas and Assets...</p>';

    // 1. Fetch the Area and Asset names from the main log table
    // We fetch up to 10,000 rows to ensure we don't miss any folders
    const { data: allRecords, error: fetchErr } = await _supabase
        .from('Assets') // Ensure this is your main data table
        .select('asset_name, location')
        .range(0, 9999); 

    if (fetchErr) {
        console.error("Error scanning entries:", fetchErr);
        container.innerHTML = '<p style="text-align:center; color:red;">Error loading log hierarchy.</p>';
        return;
    }

    container.innerHTML = ''; 

    // 2. Identify every unique Area (Location)
    const uniqueAreaNames = [...new Set(allRecords.map(item => item.location || 'Unassigned'))].sort();

    uniqueAreaNames.forEach(areaName => {
        // Create Area Container
        const areaDiv = document.createElement('div');
        areaDiv.className = 'area-container';

        const areaHeader = document.createElement('div');
        areaHeader.className = 'area-header';
        areaHeader.innerHTML = `<span>Area: ${areaName}</span><span class="area-arrow">▶</span>`;
        
        const areaContent = document.createElement('div');
        areaContent.className = 'area-content hidden';

        areaHeader.onclick = () => {
            const isHidden = areaContent.classList.toggle('hidden');
            areaHeader.querySelector('.area-arrow').innerText = isHidden ? '▶' : '▼';
        };

        // 3. Find every unique Asset that belongs to this specific Area
        const assetsInThisArea = allRecords.filter(r => (r.location || 'Unassigned') === areaName);
        const uniqueAssetNames = [...new Set(assetsInThisArea.map(r => r.asset_name))].sort();

        uniqueAssetNames.forEach(assetName => {
            const assetDiv = document.createElement('div');
            assetDiv.className = 'asset-container';

            const assetHeader = document.createElement('div');
            assetHeader.className = 'asset-header';
            assetHeader.innerHTML = `<span>Asset: ${assetName}</span><span class="arrow">▶</span>`;
            
            const rowsDiv = document.createElement('div');
            rowsDiv.className = 'rows-container hidden';
            rowsDiv.setAttribute('data-loaded', 'false'); // For Lazy Loading

            assetHeader.onclick = async () => {
                const isHidden = rowsDiv.classList.toggle('hidden');
                assetHeader.querySelector('.arrow').innerText = isHidden ? '▶' : '▼';

                // LAZY LOAD: Only fetch the full row details when clicked
                if (!isHidden && rowsDiv.getAttribute('data-loaded') === 'false') {
                    await fetchAndRender(rowsDiv, assetName);
                }
            };

            assetDiv.appendChild(assetHeader);
            assetDiv.appendChild(rowsDiv);
            areaContent.appendChild(assetDiv);
        });

        areaDiv.appendChild(areaHeader);
        areaDiv.appendChild(areaContent);
        container.appendChild(areaDiv);
    });
}

async function fetchAndRender(container, assetName) {
    container.innerHTML = '<p style="font-size: 13px; color: #666; padding: 10px;">Loading up to 10,000 entries...</p>';

    // Fetch entries with the high range limit
    const { data: entries, error } = await _supabase
        .from('Assets') // Ensure this points to your table with individual log entries
        .select('*')
        .eq('asset_name', assetName)
        .range(0, 9999); // Fetches up to 10,000 rows

    if (error) {
        container.innerHTML = '<p style="color:red; padding:10px;">Error loading data.</p>';
        return;
    }

    container.innerHTML = ''; 
    renderEntries(container, entries);
    container.setAttribute('data-loaded', 'true');
}

function renderEntries(container, entries) {
    if (entries.length === 0) {
        container.innerHTML = '<p style="font-size: 13px; color: #666; padding: 10px;">No tamper seal records found.</p>';
        return;
    }

    entries.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'cell-row';
        row.innerHTML = `
            <textarea readonly>${entry.sub_area || ''}</textarea>
            <textarea readonly>${entry.seal_number || ''}</textarea>
            <textarea readonly>${entry.inspection_date || ''}</textarea>
            <textarea readonly>${entry.signoff || ''}</textarea>
            <textarea readonly>${entry.inspection_notes || ''}</textarea>
            <select class="status-dropdown" disabled>
                <option value="${entry.status || ''}">${entry.status || 'Select...'}</option>
            </select>
            <textarea readonly>${entry.break_date || ''}</textarea>
            <textarea readonly>${entry.responsible_party || ''}</textarea>
            <textarea readonly>${entry.break_reason || ''}</textarea>
        `;
        applyStatusColor(row.querySelector('.status-dropdown'));
        container.appendChild(row);
    });
}

function applyStatusColor(el) {
    const row = el.closest('.cell-row');
    if (!row) return;

    const val = el.value.toLowerCase();

    // Reset row classes
    row.classList.remove('row-intact', 'row-broken', 'row-removed');

    if (val.includes("intact") || val.includes("pass")) {
        row.classList.add('row-intact');
    } else if (val.includes("broken") || val.includes("fail")) {
        row.classList.add('row-broken');
    } else if (val.includes("removed") || val.includes("replaced") || val.includes("void")) {
        row.classList.add('row-removed');
    }
}

// Global toggle functions
function expandAll() {
    document.querySelectorAll('.rows-container').forEach(c => c.classList.remove('hidden'));
    document.querySelectorAll('.arrow').forEach(a => a.innerText = '▼');
}

function collapseAll() {
    document.querySelectorAll('.rows-container').forEach(c => c.classList.add('hidden'));
    document.querySelectorAll('.arrow').forEach(a => a.innerText = '▶');
}

window.onload = createAssetLog;
</script>
</body>
